# Lint workflow for kalmix, from the r-lib/actions v2 lint example.
# Lints are reported in the log and do not fail the job: the package had
# 76 lints when this workflow was added, and they are cleared in their own
# changes.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # acir lives in a subdirectory of its repository; it is named here
          # as R-CMD-check.yaml does, so pak can resolve it.
          extra-packages: |
            any::lintr
            local::.
            github::biometryhub/ACI/acir@dbec5a1ee5f3ec9b8863260d2e35e52f02702b6c
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: false
