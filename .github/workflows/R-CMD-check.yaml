# Standard R CMD check matrix (r-lib/actions check-standard): three operating
# systems and three R versions. Runs on pushes and pull requests to main only,
# so feature-branch work stays local and the minutes budget is bounded.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # kernR is a private sibling package used only as an optional test
      # oracle (every use sits behind skip_if_not_installed). It is not on
      # CRAN and this runner has no access to it, so it is dropped from
      # Suggests before dependency resolution; the affected tests skip.
      - name: Drop the private kernR test oracle from Suggests
        run: perl -0pi -e 's/^[ \t]*kernR,\r?\n//m' DESCRIPTION
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # aciR is the ACI conformance oracle: a second implementation of the
      # method whose numerical core is graded against the authors' MATLAB
      # reference. It is public and not on CRAN, so it is installed from
      # GitHub rather than dropped; without it the conformance suite skips and
      # the grade is not run in the clean room, which is the gap this job
      # exists to close.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::biometryhub/ACI/aciR
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
