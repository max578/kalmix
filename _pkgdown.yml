url: https://github.com/max578/kalmix

template:
  bootstrap: 5

reference:
- title: Linear-Gaussian state space
  desc: >
    Build a state-space model and run the closed-form Kalman filter and
    Rauch-Tung-Striebel smoother.
  contents:
  - ssm
  - kalman_filter
  - rts_smoother
  - kalman_fit
  - rts_fit

- title: Regime switching
  desc: >
    Filter a series that switches between several linear-Gaussian regimes.
  contents:
  - mixture_filter
  - regime_fit

- title: Hidden Markov models
  desc: >
    Discrete-state filtering, smoothing and Viterbi decoding.
  contents:
  - hmm
  - hmm_filter
  - hmm_viterbi
  - hmm_fit

- title: Change-point detection
  desc: >
    Detect shifts in the mean of a sequence.
  contents:
  - detect_changepoint
  - changepoint_fit

- title: Causal inference
  desc: >
    The single-case interrupted-time-series causal contrast and the
    time-resolved assimilative-causal-inference read-out.
  contents:
  - its_causal
  - its_fit
  - aci
  - causal_information_rate
  - aci_fit

- title: Pairs-trading application
  desc: >
    Mean-reverting spread estimation and the volatility-regime filter.
  contents:
  - spread_series
  - ou_fit
  - spread_model
  - half_life
  - kalmix_filter

articles:
- title: Articles
  navbar: ~
  contents:
  - state_space
  - change_points
  - assimilative_causal_inference
  - pairs_trading
